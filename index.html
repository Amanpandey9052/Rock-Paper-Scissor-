<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="title">Rock Paper Scissor</h1>

    <div id="game-container">
        <!-- <img src="Rock, Paper, Scissor vector illustration.jpg" alt="rock paper scissor" id="game-image"> -->
        <div id="choices">
            <div class="choice" id="rock">
                <img src="rock.png" alt="rock">
            </div>
            <div class="choice" id="paper">
                <img src="paper.png" alt="paper">
            </div>
            <div class="choice" id="scissor">
                <img src="scissors.png" alt="Scissor">
            </div>
        </div>
        <div id="score-board">
            <div id="user">
                <p id="user-score">0</p>
                <p id="you">You</p>
            </div>
            <div id="comp">
                <p id="comp-score">0</p>
                <p id="computer">Comp   </p>
            </div>
        </div>
        <div id="result">
            <h2 id="result-para">Pick your move</h2>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
